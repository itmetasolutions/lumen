name: Release

# Builds both Windows installers on GitHub's own Windows runner and attaches
# them to the release. Nothing is built on your machine and no personal access
# token is involved — Actions issues its own scoped token for the job.
#
# Two ways to start it:
#   - push a tag: git tag v0.2.0 && git push origin v0.2.0
#   - or Actions → Release → Run workflow, and type the version
#
# Both publish configs set releaseType: "release", so the release goes LIVE as
# soon as the assets finish uploading — electron-builder's own default is
# "draft", but this project overrides it. Every installed copy will offer the
# update on its next check, without anyone pressing anything.
#
# For a review step instead, set releaseType to "draft" in package.json
# (build.publish) and in electron-builder.agent.json.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  # The only write this job needs: creating the release and uploading to it.
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # next build imports the server modules, which construct a Prisma client.
      # It never opens a connection — every page that reads the database is
      # dynamic — but the URL still has to parse. This one points nowhere on
      # purpose and is not a secret.
      DATABASE_URL: postgresql://lumen:lumen@127.0.0.1:5432/lumen?schema=public
      DATABASE_URL_UNPOOLED: postgresql://lumen:lumen@127.0.0.1:5432/lumen?schema=public
      # Each installed copy generates its own on first run; this only satisfies
      # the build and is never shipped.
      AUTH_SECRET: build-time-placeholder-not-used-at-runtime
      # electron-builder picks this up for the release it creates.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # There is no postinstall hook, so a fresh checkout has no generated
      # Prisma client — and both the type check and the tests import it. The
      # build would regenerate it later, but only after those two steps have
      # already failed.
      - name: Generate the Prisma client
        run: npx prisma generate

      # Catches a broken build before spending twenty minutes packaging one.
      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fails loudly rather than shipping a release whose feeds claim the old
      # version — the updater compares versions, so a stale number means no
      # installed copy would ever offer the update.
      - name: Check package.json matches the tag
        shell: pwsh
        run: |
          $expected = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          $actual = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "tag=$expected  package.json=$actual"
          if ($expected -ne $actual) {
            Write-Error "package.json is $actual but the release is $expected. Bump the version, commit, and tag again."
            exit 1
          }

      # Create the release BEFORE either build.
      #
      # Both publish steps run electron-builder with --publish always, and each
      # will create the release itself if it cannot find one for this tag. They
      # run sequentially, but GitHub's API is eventually consistent: on v0.2.1
      # the second run queried the releases list, did not yet see the one the
      # first had just made, and created a duplicate. The result was two
      # releases sharing one tag with the assets split between them — and
      # /releases/latest/download/ serving 404 for half of them.
      #
      # Creating it once here means both runs find an existing release and only
      # upload into it. Idempotent, so re-running the workflow is safe.
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'v${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists — the builds will upload into it."
            exit 0
          }

          # Use this version's own section of the changelog as the body, so the
          # notes are there without anyone pasting them in afterwards.
          $notes = "See CHANGELOG.md for the full notes."
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = ($lines | Select-String -Pattern "^## $tag " | Select-Object -First 1).LineNumber
            if ($start) {
              $rest = $lines[$start..($lines.Count - 1)]
              $end = ($rest | Select-String -Pattern '^## v' | Select-Object -First 1).LineNumber
              $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
              $notes = ($body -join "`n").Trim()
            }
          }

          $notes | Out-File -FilePath release-notes.txt -Encoding utf8
          gh release create $tag --title $tag --notes-file release-notes.txt
          Write-Host "Created release $tag."

      # ── The main app ────────────────────────────────────────────────────
      # desktop:publish runs the Next build, bundles the worker, compiles the
      # Electron layer, packages, and uploads. It writes latest.yml.
      - name: Build and upload Lumen
        run: npm run desktop:publish

      # ── The agent app ───────────────────────────────────────────────────
      # Reuses the Electron compile from the step above and writes agent.yml,
      # so the two apps' update feeds stay separate inside one release.
      - name: Build and upload Lumen Agent
        run: npm run agent:publish

      # Check the RELEASE, not the build output.
      #
      # Listing the files that exist on the runner proves only that packaging
      # worked. v0.2.1 packaged both installers perfectly and still shipped
      # broken, because the assets landed on two different releases sharing one
      # tag and half the download links returned 404. The only thing worth
      # asserting is what a user can actually download.
      - name: Verify the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'v${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }

          # More than one release on a tag is the failure mode itself.
          $all = gh release list --limit 50 --json tagName |
            ConvertFrom-Json |
            Where-Object { $_.tagName -eq $tag }
          if ($all.Count -gt 1) {
            Write-Error "$($all.Count) releases share the tag $tag. Delete the extras — half the download links will 404."
            exit 1
          }

          $expected = @(
            'Lumen-Setup.exe',
            'Lumen-Setup.exe.blockmap',
            'latest.yml',
            'Lumen-Agent-Setup.exe',
            'Lumen-Agent-Setup.exe.blockmap',
            'agent.yml'
          )

          $actual = (gh release view $tag --json assets | ConvertFrom-Json).assets.name
          Write-Host "Assets on $tag :"
          foreach ($name in $expected) {
            $ok = $actual -contains $name
            Write-Host ("  {0} {1}" -f $(if ($ok) { 'OK  ' } else { 'MISS' }), $name)
          }

          $missing = $expected | Where-Object { $actual -notcontains $_ }
          if ($missing) {
            Write-Error "Missing from the release: $($missing -join ', ')"
            exit 1
          }

          Write-Host ''
          Write-Host "All six assets are on $tag. Installed copies will offer this update on their next check."
